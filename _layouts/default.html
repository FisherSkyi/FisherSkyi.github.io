<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != "Home" %}{{ page.title }} | {{ site.author }}{% else %}{{ site.author }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ "/assets/style.css" | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="icon" type="image/png" href="{{ "/favicon_io/favicon.ico" | relative_url }}">
</head>
<body class="page-{{ page.title | default: 'page' | slugify }}">
  {% include nav.html %}
  <main class="container{% if page.url == "/" %} home-container{% endif %}">
    {{ content }}
  </main>
  <footer class="site-footer">© {{ site.time | date: "%Y" }} {{ site.author }}. Built as a static site for GitHub Pages.</footer>
  <script id="site-shell-data" type="application/json">
    {
      "author": {{ site.author | jsonify }},
      "title": {{ site.title | jsonify }},
      "baseUrl": {{ site.baseurl | jsonify }},
      "currentPath": {{ page.url | relative_url | jsonify }},
      "nav": {{ site.nav | jsonify }}
    }
  </script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="{{ "/assets/site.js" | relative_url }}" defer></script>
</body>
</html>
